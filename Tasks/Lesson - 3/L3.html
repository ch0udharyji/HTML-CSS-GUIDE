<h1>Lesson 3: Buttons (Animated)</h1>
<h2>Q1: Make a button for Uber "Request Now"</h2>
<button class="uber">Request Now</button>
<style>
  .uber {
    background-color: black;
    color: white;
    text-align: center;
    padding: 10px 20px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    transition: opacity 0.5s ease;
  }
  .uber:hover {
    opacity: 0.8;
  }
</style>

<h2>Q2: Make a button for "LinkedIn"</h2>
<button class="linkedin">Apply on company website</button>
<button class="save">Save</button>
<style>
  .linkedin {
    background-color: rgb(10, 102, 194);
    color: white;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    text-transform: titlecase;
    border: 2px solid rgb(10, 102, 194);
    cursor: pointer;
    border-radius: 50px;
    margin-right: 10px;
    transition: all 0.3s ease;
  }
  .linkedin:hover {
    background-color: rgb(0, 60, 120);;
    color: white;
    border: 2px solid rgb(0, 60, 120);
  }
  .save {
    background-color: white;
    color: rgb(10, 102, 194);
    font-size: 16px;
    font-weight: bold;
    padding: 10px 20px;
    border: 2px solid rgb(10, 102, 194);
    cursor: pointer;
    transition: all 0.3s ease;
    border-radius: 50px;
  }
  .save:hover {
    background-color: rgb(10, 102, 194);
    color: white;
    border: 2px solid rgb(10, 102, 194);
  }
</style>

<h2>Q3: Create a button for "Amazon"</h2>
<button class="amazon">Buy Now</button>
<style>
  .amazon {
    background-color: rgb(255, 216, 20);
    color: rgb(0, 0, 0);
    padding: 10px 60px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    cursor: pointer;
    border-radius: 50px;
    transition: background-color 0.3s ease;
  }
  .amazon:hover {
    background-color: rgba(255, 149, 0, 0.8);
  }
</style>

<h2>Q4: Create a button for "Bootstrap"</h2>
<button class="bootstrap">Get Started</button>
<button class="download">Download</button>
<style>
  .bootstrap {
    background-color: rgb(121, 82, 179);
    color: white;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    border: rgb(121, 82, 179) solid 2px;
    cursor: pointer;
    border-radius: 5px;
    margin-right: 10px;
    transition: all 0.3s ease;
  }
  .bootstrap:hover {
    background-color: white;
    color: rgb(121, 82, 179);
    border: rgb(121, 82, 179) solid 2px;
  }
  .download {
    background-color: white;
    color: rgb(108, 117, 125);
    border: 2px solid rgb(108, 117, 125);
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
    transition: all 0.3s ease;
  }
  .download:hover {
    background-color: rgb(108, 117, 125);
    color: white;
    border: 2px solid rgb(108, 117, 125);
  }
</style>
